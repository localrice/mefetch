name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o mefetch-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o mefetch-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o mefetch-darwin-arm64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mefetch-linux-amd64
            mefetch-darwin-amd64
            mefetch-darwin-arm64